spring.application.name=ecommerce

# ── MongoDB ────────────────────────────────────────────────────────────────────
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ecommerce}
spring.data.mongodb.database=${MONGODB_DATABASE:ecommerce}

server.port=8080

jwt.secret=Zm9yLWRldmVsb3BtZW50LW9ubHktc2VjdXJlLWtleS0zMmJ5dGVzLWxvbmc=
jwt.expiration-ms=86400000

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.use-root-path=true

# Actuator / Health Monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.info.env.enabled=true
management.endpoint.prometheus.enabled=true

# Day 26: Distributed tracing (Micrometer + Zipkin)
management.tracing.enabled=true
management.tracing.sampling.probability=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
management.zipkin.tracing.endpoint=${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}

info.app.name=E-Commerce API
info.app.description=Monolithic e-commerce backend with JWT, Swagger, Docker, and health monitoring
info.app.version=0.0.1-SNAPSHOT

# CORS Configuration
app.cors.allowed-origins=http://localhost:3000,http://localhost:4200

# ── Day 6: Email Notifications (SMTP) ─────────────────────────────────────────
# Set these env vars or replace defaults with your Gmail credentials
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Sender display name shown in emails
app.email.sender-name=${MAIL_SENDER_NAME:ShopEasy E-Commerce}
# Set to false to disable all emails (useful for local dev without SMTP)
app.email.enabled=${MAIL_ENABLED:false}

# Disable mail health indicator to prevent Actuator health check 503 failures due to default SMTP credentials
management.health.mail.enabled=false